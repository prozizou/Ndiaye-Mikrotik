name: Supervision périodique du parc

# Complète le cron Vercel (vercel.json), limité à une fois par jour sur le
# plan Hobby — ce workflow appelle le même endpoint plus souvent. GitHub
# n'exécute pas les schedules "*/15" à la minute près sur un dépôt à faible
# activité (parfois retardé, documentation GitHub Actions) : compter sur un
# passage toutes les ~15-30 min, pas un vrai temps réel.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/diagnostics
        run: |
          curl --fail-with-body -sS -X GET "https://ndiaye-mikrotik.vercel.app/api/cron/diagnostics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
